<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>3note advisors</title>
  <meta name="description" content="3note advisors — A boutique investment advisor focused on under-the-radar, alternative assets.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400&family=Playfair+Display:wght@400;500&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
    :root {
      --olive: #5a6b2f;
      --olive-dark: #3d4a1f;
      --olive-light: #7a8c4e;
      --cream: #f5f2eb;
      --text-primary: #2c2c2c;
      --text-secondary: #6a6a6a;
      --text-light: #999;
    }
    html, body { height: 100%; }
    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      background: var(--cream);
      display: flex;
      align-items: center;
      justify-content: center;
      -webkit-font-smoothing: antialiased;
    }
    .page {
      text-align: center;
      padding: 40px;
      max-width: 560px;
    }
    .logo { margin-bottom: 48px; }
    .logo svg { height: 72px; width: auto; }
    .divider {
      width: 40px;
      height: 1.5px;
      background: var(--olive-light);
      margin: 0 auto 40px;
      opacity: 0.4;
    }
    .tagline {
      font-family: 'Playfair Display', Georgia, serif;
      font-size: 1.2rem;
      font-weight: 400;
      color: var(--text-primary);
      line-height: 1.7;
      margin-bottom: 48px;
      letter-spacing: 0.01em;
    }
    .contact-label {
      font-size: 0.72rem;
      font-weight: 400;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: var(--text-light);
      margin-bottom: 10px;
    }
    .contact-email {
      font-family: 'Inter', sans-serif;
      font-size: 0.95rem;
      font-weight: 300;
      color: var(--olive);
      text-decoration: none;
      border-bottom: 1px solid rgba(90, 107, 47, 0.25);
      padding-bottom: 1px;
      transition: border-color 0.3s;
    }
    .contact-email:hover { border-color: var(--olive); }
    .footer {
      position: fixed;
      bottom: 24px;
      left: 0;
      width: 100%;
      text-align: center;
      font-size: 0.68rem;
      color: var(--text-light);
      letter-spacing: 0.03em;
    }
    @media (max-width: 480px) {
      .logo svg { height: 56px; }
      .tagline { font-size: 1.05rem; }
      .page { padding: 32px 24px; }
    }
  </style>
</head>
<body>
  <div class="page">
    <div class="logo">
      <svg viewBox="0 0 200 58" xmlns="http://www.w3.org/2000/svg">
        <g fill="#5a6b2f">
          <rect x="60" y="2" width="36" height="3" rx="1.5"/>
          <rect x="60" y="10" width="36" height="3" rx="1.5"/>
          <rect x="60" y="18" width="36" height="3" rx="1.5"/>
          <rect x="60" y="26" width="36" height="3" rx="1.5"/>
          <rect x="60" y="34" width="28" height="3" rx="1.5"/>
          <text x="100" y="30" font-family="'Playfair Display', Georgia, serif" font-size="32" font-weight="500" text-anchor="start" fill="#5a6b2f">3note</text>
          <text x="100" y="50" font-family="'Inter', sans-serif" font-size="15" font-weight="300" letter-spacing="4" text-anchor="start" fill="#5a6b2f">advisors</text>
        </g>
      </svg>
    </div>
    <div class="divider"></div>
    <p class="tagline">A boutique investment advisor focused on<br>under-the-radar, alternative assets.</p>
    <p class="contact-label">To reach our research team</p>
    <a class="contact-email" href="mailto:research@3noteadvisors.com">research@3noteadvisors.com</a>
  </div>
  <div class="footer">&copy; 2026 3note advisors</div>
</body>
</html>
