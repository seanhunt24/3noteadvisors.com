  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
    :root {
      --olive: #5a6b2f;
      --olive-dark: #3d4a1f;
      --olive-light: #7a8c4e;
      --cream: #f5f2eb;
      --text-primary: #2c2c2c;
      --text-secondary: #6a6a6a;
      --text-light: #999;
    }
    html, body { height: 100%; }
    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      background: var(--cream);
      display: flex;
      align-items: center;
      justify-content: center;
      -webkit-font-smoothing: antialiased;
    }
    .page {
      text-align: center;
      padding: 40px;
      max-width: 640px;
    }
    .logo { margin-bottom: 48px; }
    .logo .logo-img { height: 72px; width: auto; display: block; margin: 0 auto; }
    .divider {
      width: 40px;
      height: 1.5px;
      background: var(--olive-light);
      margin: 0 auto 40px;
      opacity: 0.4;
    }
    .tagline {
      font-family: 'Playfair Display', Georgia, serif;
      font-size: 1.25rem;
      font-weight: 400;
      color: var(--text-primary);
      line-height: 1.8;
      margin-bottom: 56px;
      letter-spacing: 0.01em;
    }
    .contact-label {
      font-size: 0.72rem;
      font-weight: 400;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: var(--text-light);
      margin-bottom: 12px;
    }
    .contact-email {
      font-family: 'Inter', sans-serif;
      font-size: 0.95rem;
      font-weight: 300;
      color: var(--olive);
      text-decoration: none;
      border-bottom: 1px solid rgba(90, 107, 47, 0.25);
      padding-bottom: 1px;
      transition: border-color 0.3s;
    }
    .contact-email:hover { border-color: var(--olive); }
    .footer {
      position: fixed;
      bottom: 24px;
      left: 0;
      width: 100%;
      text-align: center;
      font-size: 0.68rem;
      color: var(--text-light);
      letter-spacing: 0.03em;
    }
    @media (max-width: 480px) {
      .logo .logo-img { height: 56px; }
      .tagline { font-size: 1.05rem; }
      .page { padding: 32px 24px; }
    }
  </style>
